[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deer-flow"
version = "0.1.0"
description = "DeerFlow project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.2.3",
    "langchain-core>=1.0.0",
    "langchain-community>=0.4.0",
    "langchain-experimental>=0.4.0",
    "langchain-openai>=1.1.7",
    "langgraph>=1.0.6",
    "readabilipy>=0.3.0",
    "python-dotenv>=1.0.1",
    "socksio>=1.0.0",
    "markdownify>=1.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "sse-starlette>=2.1.0",
    "pandas>=2.2.3",
    "numpy>=2.2.3",
    "yfinance>=0.2.54",
    "litellm>=1.63.11",
    "json-repair>=0.7.0",
    "jinja2>=3.1.3",
    "duckduckgo-search>=8.0.0",
    "inquirerpy>=0.3.4",
    "arxiv>=2.2.0",
    "mcp>=1.6.0",
    "langchain-mcp-adapters>=0.1.0",
    "langchain-deepseek>=1.0.1",
    "psutil>=7.0.0",
    "toml>=0.10.2",
    "watchdog>=3.0.0",
    "pydantic-settings>=2.0.0",
    "docker>=7.0.0",
    "playwright>=1.40.0",
    "matplotlib>=3.8.0",
    "plotly>=5.18.0",
    "tiktoken>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.2.0",
    "ruff>=0.12.2",
    "langgraph-cli[inmem]>=0.4.11",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.report]
fail_under = 25

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
^/build/
| ^/deer-flow-2.0/
'''

[tool.ruff]
extend-exclude = ["deer-flow-2.0"]

[dependency-groups]
test = [
    "pytest-cov>=6.0.0",
]
